<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>吴若的img</title>
		<link rel="stylesheet" href="css/index.css" />
	</head>
	<body>
		
		<div class="wrap">
	
		<div class="cube">
			
			<div class="out_front">
				<img src="img/01.jpg"  class="pic"/>
			</div>
			
			<div class="out_back">
				<img src="img/02.jpg"  class="pic"/>
			</div>
			
			<div class="out_left">
				<img src="img/03.jpg"  class="pic"/>
			</div>
			<div class="out_right">
				<img src="img/04.jpg"  class="pic"/>
			</div>
			<div class="out_top">
				<img src="img/05.jpg"  class="pic"/>
			</div>
			<div class="out_bottom">
				<img src="img/06.jpg"  class="pic"/>
			</div>
			
			<span class="in_front">
				<img src="img/07.jpg" class="in_pic" />
			</span>
			<span class="in_back">
			     <img src="img/08.jpg" class="in_pic" />
			</span>
			<span class="in_left">
				<img src="img/09.jpg" class="in_pic" />
			</span>
			<span class="in_right">
				<img src="img/07.jpg" class="in_pic" />
			</span>
			<span class="in_top">
				<img src="img/08.jpg" class="in_pic" />
			</span>
			<span class="in_bottom">
				<img src="img/03.jpg" class="in_pic" />
			</span>
		</div>
		</div>
		<audio autoplay="autoplay" controls="controls"loop="loop" preload="auto"
            	src="ms/wanhuajin.mp3">

	</audio>

	</body>
</html>
