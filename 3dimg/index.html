<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>wuruo的img</title>
    <link rel="stylesheet" href="css/index.css" />
</head>

<body>
    <canvas id="sakuraCanvas"></canvas>
    <div class="wrap">
        <div class="cube">
            <div class="out_front">
                <img src="img/01.jpg" class="pic" />
            </div>
            <div class="out_back">
                <img src="img/02.jpg" class="pic" />
            </div>
            <div class="out_left">
                <img src="img/03.jpg" class="pic" />
            </div>
            <div class="out_right">
                <img src="img/04.jpg" class="pic" />
            </div>
            <div class="out_top">
                <img src="img/05.jpg" class="pic" />
            </div>
            <div class="out_bottom">
                <img src="img/06.jpg" class="pic" />
            </div>
            <span class="in_front">
                <img src="img/07.jpg" class="in_pic" />
            </span>
            <span class="in_back">
                <img src="img/08.jpg" class="in_pic" />
            </span>
            <span class="in_left">
                <img src="img/09.jpg" class="in_pic" />
            </span>
            <span class="in_right">
                <img src="img/07.jpg" class="in_pic" />
            </span>
            <span class="in_top">
                <img src="img/08.jpg" class="in_pic" />
            </span>
            <span class="in_bottom">
                <img src="img/03.jpg" class="in_pic" />
            </span>
        </div>
    </div>
    <audio autoplay="autoplay" controls="controls" loop="loop" preload="auto" src="ms/wanhuajin.mp3">
        你的浏览器版本太低，不支持audio标签
    </audio>
    <script>
        window.onload = function () {
            const canvas = document.getElementById('sakuraCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const sakuras = [];
            const numSakuras = 50;

            class Sakura {
                constructor() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * -canvas.height;
                    this.size = Math.random() * 10 + 5;
                    this.speedY = Math.random() * 2 + 1;
                    this.speedX = (Math.random() - 0.5) * 0.5;
                }

                draw() {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.scale(this.size / 10, this.size / 10);

                    const petalColor = 'rgba(255, 192, 203, 0.8)';
                    const centerColor = 'rgba(255, 228, 225, 0.8)';

                    // 绘制花瓣
                    for (let i = 0; i < 5; i++) {
                        ctx.beginPath();
                        ctx.moveTo(0, 0);
                        ctx.bezierCurveTo(2, -3, 6, -3, 8, 0);
                        ctx.bezierCurveTo(6, 3, 2, 3, 0, 0);
                        ctx.fillStyle = petalColor;
                        ctx.fill();
                        ctx.rotate((2 * Math.PI) / 5);
                    }

                    // 绘制花蕊
                    ctx.beginPath();
                    ctx.arc(0, 0, 1, 0, 2 * Math.PI);
                    ctx.fillStyle = centerColor;
                    ctx.fill();

                    ctx.restore();
                }

                update() {
                    this.y += this.speedY;
                    this.x += this.speedX;

                    if (this.y > canvas.height) {
                        this.y = Math.random() * -canvas.height;
                        this.x = Math.random() * canvas.width;
                    }
                }
            }

            for (let i = 0; i < numSakuras; i++) {
                sakuras.push(new Sakura());
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                for (let i = 0; i < sakuras.length; i++) {
                    sakuras[i].draw();
                    sakuras[i].update();
                }

                requestAnimationFrame(animate);
            }

            animate();
        };
    </script>
</body>

</html>
